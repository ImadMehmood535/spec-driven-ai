services:
  postgres:
    image: postgres:16-alpine
    container_name: developer-user-db
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5440}:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-developer_user}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-developer_user}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
